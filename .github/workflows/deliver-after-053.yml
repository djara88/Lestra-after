name: Deliver After 0.5.3 to ChatGPT

on:
  push:
    branches:
      - delivery/after-0.5.3

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download after-beta-0.5.3 \
            --repo djara88/Lestra-after \
            --pattern 'Lestra-After-Beta-0.5.3.apk'
          test -f Lestra-After-Beta-0.5.3.apk
          echo '59e8fc4fec54c291c0f491fe95c09030797d0516e2627cfbe1e3d5dea087004a  Lestra-After-Beta-0.5.3.apk' | sha256sum -c -

      - name: Upload APK for ChatGPT handoff
        uses: actions/upload-artifact@v4
        with:
          name: lestra-after-beta-0.5.3
          path: Lestra-After-Beta-0.5.3.apk
          retention-days: 1
          compression-level: 0
