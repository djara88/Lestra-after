name: Deliver After 0.5.3 to ChatGPT

on:
  push:
    branches:
      - delivery/after-0.5.3

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download after-beta-0.5.3 \
            --repo djara88/Lestra-after \
            --pattern 'Lestra-After-Beta-0.5.3.apk'
          test -f Lestra-After-Beta-0.5.3.apk
          sha256sum Lestra-After-Beta-0.5.3.apk

      - name: Create temporary transfer link
        run: |
          set -euo pipefail
          url=$(curl -L --fail --silent --show-error \
            --upload-file Lestra-After-Beta-0.5.3.apk \
            https://transfer.sh/Lestra-After-Beta-0.5.3.apk)
          echo "$url"
          case "$url" in
            http://*|https://*) ;;
            *) echo "Unexpected upload response: $url"; exit 1 ;;
          esac
          echo "APK_TEMP_URL=$url"
