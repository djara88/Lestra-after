name: Deliver After 0.5.3 to ChatGPT

on:
  push:
    branches:
      - delivery/after-0.5.3

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download after-beta-0.5.3 \
            --repo djara88/Lestra-after \
            --pattern 'Lestra-After-Beta-0.5.3.apk'
          test -f Lestra-After-Beta-0.5.3.apk
          sha256sum Lestra-After-Beta-0.5.3.apk

      - name: Create temporary transfer link
        run: |
          set -euo pipefail
          response=$(curl -L --fail --silent --show-error --max-time 300 \
            https://bashupload.com/Lestra-After-Beta-0.5.3.apk \
            --data-binary @Lestra-After-Beta-0.5.3.apk)
          echo "$response"
          url=$(printf '%s\n' "$response" | grep -Eo 'https?://[^[:space:]<>]+' | tail -n1 | sed 's/["'"'']//g')
          test -n "$url"
          echo "APK_TEMP_URL=$url"
