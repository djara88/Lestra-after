name: Deliver After 0.5.3 to ChatGPT

on:
  push:
    branches:
      - delivery/after-0.5.3

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download after-beta-0.5.3 \
            --repo djara88/Lestra-after \
            --pattern 'Lestra-After-Beta-0.5.3.apk'
          test -f Lestra-After-Beta-0.5.3.apk
          sha256sum Lestra-After-Beta-0.5.3.apk

      - name: Create one-time transfer link
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -F 'file=@Lestra-After-Beta-0.5.3.apk' \
            -F 'expires=1d' \
            -F 'maxDownloads=1' \
            -F 'autoDelete=true' \
            https://file.io/)
          echo "$response"
          url=$(printf '%s' "$response" | jq -r '.link // empty')
          test -n "$url"
          echo "APK_TEMP_URL=$url"
