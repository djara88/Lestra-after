name: Deliver After 0.5.3 to ChatGPT

on:
  push:
    branches:
      - delivery/after-0.5.3

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download after-beta-0.5.3 \
            --repo djara88/Lestra-after \
            --pattern 'Lestra-After-Beta-0.5.3.apk'
          test -f Lestra-After-Beta-0.5.3.apk
          sha256sum Lestra-After-Beta-0.5.3.apk

      - name: Create temporary transfer link
        run: |
          set -euo pipefail
          response=$(curl -L --fail --silent --show-error --max-time 600 \
            -F 'file=@Lestra-After-Beta-0.5.3.apk' \
            https://upload.gofile.io/uploadfile)
          echo "$response"
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          test "$status" = "ok"
          page=$(printf '%s' "$response" | jq -r '.data.downloadPage // empty')
          token=$(printf '%s' "$response" | jq -r '.data.guestToken // empty')
          file_id=$(printf '%s' "$response" | jq -r '.data.id // empty')
          parent=$(printf '%s' "$response" | jq -r '.data.parentFolder // empty')
          test -n "$page"
          echo "GOFILE_PAGE=$page"
          echo "GOFILE_GUEST_TOKEN=$token"
          echo "GOFILE_FILE_ID=$file_id"
          echo "GOFILE_PARENT=$parent"
