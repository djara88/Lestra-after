name: CI - Self Hosted

on:
  workflow_dispatch:
  push:
    branches:
      - feat/after-stabilization-auth-runner-v1
  pull_request:
    branches:
      - feat/after-school-core-ocr

permissions:
  contents: read

concurrency:
  group: after-ci-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilization:
    runs-on: [self-hosted, Windows, X64, after-builder]
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      EXPO_PUBLIC_ENABLE_AZURE_AUTH: 'false'
      EXPO_PUBLIC_ENABLE_ENTERPRISE_SSO: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install mobile dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-fund

      - name: Mobile typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Expo compatibility
        shell: pwsh
        run: npx expo install --check

      - name: Expo public config
        shell: pwsh
        run: npx expo config --type public | Out-Null

      - name: Bundle Android JavaScript
        shell: pwsh
        run: npx expo export --platform android --output-dir dist-ci-android

      - name: Bundle iOS JavaScript
        shell: pwsh
        run: npx expo export --platform ios --output-dir dist-ci-ios

      - name: Install admin dependencies
        shell: pwsh
        working-directory: admin-web
        run: npm ci --ignore-scripts --no-fund

      - name: Admin audit
        shell: pwsh
        working-directory: admin-web
        run: npm audit --omit=dev --audit-level=high

      - name: Admin typecheck
        shell: pwsh
        working-directory: admin-web
        run: npm run typecheck

      - name: Admin build
        shell: pwsh
        working-directory: admin-web
        run: npm run build
