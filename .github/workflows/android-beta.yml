name: Android Beta APK

on:
  push:
    branches:
      - feat/after-school-core-ocr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://yihcktculicmuuzzxzik.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZpxmCzRu3-CQ8LIUXhdZtA_lOhk_wzU
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Google Sign-In configuration
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Missing repository secret EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
            exit 1
          fi
          case "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::error::EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID is not a valid Google OAuth Web Client ID"; exit 1 ;;
          esac
      - run: npm install --ignore-scripts --no-fund
      - run: npm run typecheck
      - name: Validate Expo dependency compatibility
        run: npx expo install --check
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify bundled JavaScript is packaged
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle|assets/.*\.bundle' >/dev/null
      - name: Publish beta APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Lestra-After-Beta-0.5.1.apk
          if gh release view after-beta-0.5.1 >/dev/null 2>&1; then
            gh release upload after-beta-0.5.1 Lestra-After-Beta-0.5.1.apk --clobber
          else
            gh release create after-beta-0.5.1 Lestra-After-Beta-0.5.1.apk \
              --title "Lestra After Beta 0.5.1" \
              --notes "Corrección Android: restaura el inicio de sesión nativo con Google y mantiene el rediseño responsive e iconografía propia de After." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
