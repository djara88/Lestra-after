name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      EXPO_PUBLIC_ENABLE_AZURE_AUTH: 'false'
      EXPO_PUBLIC_ENABLE_ENTERPRISE_SSO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - name: Validate Expo dependency compatibility
        run: npx expo install --check
      - name: Validate Expo public config
        run: npx expo config --type public > /dev/null
      - name: Bundle Android app
        run: npx expo export --platform android --output-dir dist-ci-android
      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir dist-ci-ios

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
