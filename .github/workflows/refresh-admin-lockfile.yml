name: Refresh admin lockfile
on:
  push:
    branches: [platform-admin-web]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd admin-web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh After admin lockfile"
          git push
